<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - TalentIQ Staffing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/lg.png">
  <style>
    :root {
      --navy-dark: #0E1B3D;
      --navy-light: #182C5C;
      --gold: #C5A880;
      --gold-hover: #B5976F;
      --white: #ffffff;
      --bg-gradient: linear-gradient(135deg, #0A132C 0%, #152752 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Source Sans 3', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--white);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: rgba(14, 27, 61, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(197, 168, 128, 0.2);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .logo-img {
      width: 120px;
      margin-bottom: 20px;
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--white);
    }

    p.subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: var(--gold);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(197, 168, 128, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--navy-dark);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .login-btn:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(197, 168, 128, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid rgba(239, 83, 80, 0.3);
      color: #ef5350;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="../assets/images/lg.png" class="logo-img" alt="TalentIQ Logo">
    <h2>Admin Portal</h2>
    <p class="subtitle">Please sign in to manage job listings</p>

    <div id="error-box" class="error-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Email / Username</label>
        <input type="text" id="username" placeholder="admin@talentiq.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">Secure Login</button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');

      errorBox.style.display = 'none';

      try {
        const baseUrl = window.API_BASE_URL || 'http://localhost:3000';
        const response = await fetch(`${baseUrl}/api/admin/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = data.redirect;
        } else {
          errorBox.textContent = data.error || 'Authentication failed. Please try again.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'An error occurred. Please check your connection and try again.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
