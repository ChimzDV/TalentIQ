<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - TalentIQ Staffing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/lg.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    :root {
      --navy-dark: #0E1B3D;
      --navy-medium: #152752;
      --navy-light: #1c3266;
      --gold: #C5A880;
      --gold-hover: #B5976F;
      --white: #ffffff;
      --bg: #070D1E;
      --border: rgba(197, 168, 128, 0.15);
      --success: #2e7d32;
      --warning: #ef6c00;
      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Source Sans 3', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      background: var(--navy-dark);
      border-bottom: 1px solid var(--border);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      height: 40px;
    }

    .brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .brand h1 span {
      color: var(--gold);
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .logout-btn:hover {
      background: var(--gold);
      color: var(--navy-dark);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 30px auto;
      padding: 0 20px;
      flex-grow: 1;
    }

    /* Stats Section */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: var(--navy-dark);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .stat-info h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 5px;
    }

    .stat-info p {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--gold);
    }

    .stat-icon {
      font-size: 2.5rem;
      color: rgba(197, 168, 128, 0.25);
    }

    /* Controls Area */
    .controls-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .controls-wrapper h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .add-job-btn {
      padding: 12px 24px;
      background: var(--gold);
      color: var(--navy-dark);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .add-job-btn:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(197, 168, 128, 0.3);
    }

    /* Jobs Table / List */
    .table-wrapper {
      background: var(--navy-dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    th {
      background: rgba(197, 168, 128, 0.05);
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge.published {
      background: rgba(46, 125, 50, 0.15);
      color: #81c784;
      border: 1px solid rgba(46, 125, 50, 0.3);
    }

    .badge.draft {
      background: rgba(239, 108, 0, 0.15);
      color: #ffb74d;
      border: 1px solid rgba(239, 108, 0, 0.3);
    }

    .actions-cell {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--white);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn.edit:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .action-btn.delete:hover {
      border-color: #e57373;
      color: #e57373;
      background: rgba(229, 115, 115, 0.05);
    }

    .action-btn.toggle-status:hover {
      border-color: #81c784;
      color: #81c784;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--navy-dark);
      border: 1px solid var(--border);
      max-width: 800px;
      width: 100%;
      border-radius: 12px;
      padding: 30px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 15px;
    }

    .modal-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      color: var(--gold);
    }

    .close-modal {
      background: transparent;
      border: none;
      color: var(--white);
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .close-modal:hover {
      opacity: 1;
    }

    /* Form Layouts */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group-full {
      grid-column: span 2;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: rgba(255,255,255,0.7);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .form-group textarea {
      resize: vertical;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 25px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--white);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy-dark);
      border: none;
    }

    .btn-primary:hover {
      background: var(--gold-hover);
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group-full {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="../assets/images/lg.png" alt="TalentIQ Logo">
      <h1>TalentIQ <span>Admin</span></h1>
    </div>
    <div class="user-actions">
      <a href="/talentiq-admin/logout" class="logout-btn"><i class="fa fa-sign-out"></i> Logout</a>
    </div>
  </header>

  <div class="container">
    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <h3>Total Jobs</h3>
          <p id="stat-total">0</p>
        </div>
        <div class="stat-icon"><i class="fa fa-briefcase"></i></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Published Jobs</h3>
          <p id="stat-published" style="color: #81c784;">0</p>
        </div>
        <div class="stat-icon"><i class="fa fa-eye"></i></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Draft Jobs</h3>
          <p id="stat-draft" style="color: #ffb74d;">0</p>
        </div>
        <div class="stat-icon"><i class="fa fa-pencil-square-o"></i></div>
      </div>
    </div>

    <!-- Controls & Title -->
    <div class="controls-wrapper">
      <h2>Manage Job Openings</h2>
      <button class="add-job-btn" id="open-add-modal"><i class="fa fa-plus"></i> Add New Job</button>
    </div>

    <!-- Jobs Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Industry</th>
            <th>Location</th>
            <th>Type</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-table-body">
          <!-- Populated dynamically via JS -->
          <tr>
            <td colspan="6" style="text-align: center; color: rgba(255,255,255,0.4);">Loading jobs...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Job Modal -->
  <div class="modal" id="job-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Add New Job</h3>
        <button class="close-modal" id="close-modal-btn">&times;</button>
      </div>
      <form id="job-form">
        <input type="hidden" id="job-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="f-title">Job Title *</label>
            <input type="text" id="f-title" required placeholder="e.g. Senior Software Engineer">
          </div>
          <div class="form-group">
            <label for="f-industry">Industry *</label>
            <select id="f-industry" required>
              <option value="" disabled selected>Select Industry</option>
              <option value="it">IT & Digital Staffing</option>
              <option value="healthcare">Healthcare Staffing</option>
              <option value="engineering">Engineering & Technical</option>
              <option value="aerospace">Aerospace & Defense</option>
              <option value="federal">Federal & Government</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-location">Location (City, State) *</label>
            <input type="text" id="f-location" required placeholder="e.g. New York, NY or Remote / USA">
          </div>
          <div class="form-group">
            <label for="f-state">State Code (Optional)</label>
            <input type="text" id="f-state" placeholder="e.g. NY or USA">
          </div>
          <div class="form-group">
            <label for="f-type">Employment Type *</label>
            <select id="f-type" required>
              <option value="" disabled selected>Select Type</option>
              <option value="full-time">Full-Time</option>
              <option value="part-time">Part-Time</option>
              <option value="contract">Contract</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-experience">Experience Level</label>
            <input type="text" id="f-experience" placeholder="e.g. 2-5 Years or 3+ Yrs Exp">
          </div>
          <div class="form-group">
            <label for="f-salary">Salary / Compensation (Optional)</label>
            <input type="text" id="f-salary" placeholder="e.g. $85,000 - $95,000 or $25/hr">
          </div>
          <div class="form-group">
            <label for="f-deadline">Application Deadline (Optional)</label>
            <input type="date" id="f-deadline">
          </div>
          <div class="form-group">
            <label for="f-status">Status *</label>
            <select id="f-status" required>
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
          <div class="form-group-full form-group">
            <label for="f-short-desc">Short Description (Displays on card search) *</label>
            <input type="text" id="f-short-desc" required placeholder="A brief one-sentence overview...">
          </div>
          <div class="form-group-full form-group">
            <label for="f-desc">Full Description (Optional)</label>
            <textarea id="f-desc" rows="3" placeholder="Provide full context about this opening..."></textarea>
          </div>
          <div class="form-group-full form-group">
            <label for="f-requirements">Requirements (Semicolon ';' separated) *</label>
            <textarea id="f-requirements" rows="2" required placeholder="Requirement 1; Requirement 2; Requirement 3"></textarea>
          </div>
          <div class="form-group-full form-group">
            <label for="f-responsibilities">Responsibilities (Semicolon ';' separated) *</label>
            <textarea id="f-responsibilities" rows="2" required placeholder="Responsibility 1; Responsibility 2; Responsibility 3"></textarea>
          </div>
          <div class="form-group-full form-group">
            <label for="f-benefits">Benefits (Semicolon ';' separated) *</label>
            <textarea id="f-benefits" rows="2" required placeholder="Benefit 1; Benefit 2; Benefit 3"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save Job</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script>
    let allJobs = [];
    const modal = document.getElementById('job-modal');
    const jobForm = document.getElementById('job-form');
    const modalTitle = document.getElementById('modal-title');
    const getBaseUrl = () => window.API_BASE_URL || 'http://localhost:5000';

    async function fetchJobs() {
      try {
        const res = await fetch(`${getBaseUrl()}/api/admin/jobs`);
        if (!res.ok) throw new Error('Unauthenticated');
        allJobs = await res.json();
        renderStats();
        renderTable();
      } catch (err) {
        window.location.href = '/talentiq-admin/login';
      }
    }

    function renderStats() {
      document.getElementById('stat-total').textContent = allJobs.length;
      document.getElementById('stat-published').textContent = allJobs.filter(j => j.status === 'published').length;
      document.getElementById('stat-draft').textContent = allJobs.filter(j => j.status === 'draft').length;
    }

    function renderTable() {
      const tbody = document.getElementById('jobs-table-body');
      if (allJobs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: rgba(255,255,255,0.4);">No jobs found. Click "Add New Job" to begin.</td></tr>`;
        return;
      }

      tbody.innerHTML = allJobs.map(job => `
        <tr>
          <td style="font-weight: 600;">${escapeHtml(job.title)}</td>
          <td style="text-transform: uppercase; font-size: 0.9rem;">${escapeHtml(job.industry)}</td>
          <td>${escapeHtml(job.location)}</td>
          <td style="text-transform: capitalize;">${escapeHtml(job.employment_type)}</td>
          <td>
            <span class="badge ${job.status}">${job.status}</span>
          </td>
          <td>
            <div class="actions-cell">
              <button class="action-btn toggle-status" onclick="toggleStatus(${job.id}, '${job.status}')">
                <i class="fa ${job.status === 'published' ? 'fa-eye-slash' : 'fa-eye'}"></i>
                ${job.status === 'published' ? 'Unpublish' : 'Publish'}
              </button>
              <button class="action-btn edit" onclick="openEditModal(${job.id})">
                <i class="fa fa-pencil"></i> Edit
              </button>
              <button class="action-btn delete" onclick="deleteJob(${job.id})">
                <i class="fa fa-trash"></i> Delete
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function openAddModal() {
      jobForm.reset();
      document.getElementById('job-id').value = '';
      modalTitle.textContent = 'Add New Job';
      modal.classList.add('active');
    }

    function openEditModal(id) {
      const job = allJobs.find(j => j.id === id);
      if (!job) return;

      document.getElementById('job-id').value = job.id;
      document.getElementById('f-title').value = job.title;
      document.getElementById('f-industry').value = job.industry;
      document.getElementById('f-location').value = job.location;
      document.getElementById('f-state').value = job.state || '';
      document.getElementById('f-type').value = job.employment_type;
      document.getElementById('f-experience').value = job.experience || '';
      document.getElementById('f-salary').value = job.salary || '';
      document.getElementById('f-deadline').value = job.application_deadline || '';
      document.getElementById('f-status').value = job.status;
      document.getElementById('f-short-desc').value = job.short_description || '';
      document.getElementById('f-desc').value = job.description || '';
      document.getElementById('f-requirements').value = job.requirements || '';
      document.getElementById('f-responsibilities').value = job.responsibilities || '';
      document.getElementById('f-benefits').value = job.benefits || '';

      modalTitle.textContent = 'Edit Job Listing';
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    async function deleteJob(id) {
      if (confirm('Are you absolutely sure you want to delete this job listing? This action cannot be undone.')) {
        try {
          const res = await fetch(`${getBaseUrl()}/api/admin/jobs/${id}`, { method: 'DELETE' });
          if (res.ok) {
            fetchJobs();
          } else {
            alert('Failed to delete job');
          }
        } catch (err) {
          alert('An error occurred');
        }
      }
    }

    async function toggleStatus(id, currentStatus) {
      const job = allJobs.find(j => j.id === id);
      if (!job) return;

      const updatedJob = { ...job, status: currentStatus === 'published' ? 'draft' : 'published' };
      try {
        const res = await fetch(`${getBaseUrl()}/api/admin/jobs/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedJob)
        });
        if (res.ok) {
          fetchJobs();
        } else {
          alert('Failed to toggle status');
        }
      } catch (err) {
        alert('An error occurred');
      }
    }

    jobForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const id = document.getElementById('job-id').value;
      const jobData = {
        title: document.getElementById('f-title').value,
        industry: document.getElementById('f-industry').value,
        location: document.getElementById('f-location').value,
        state: document.getElementById('f-state').value,
        employment_type: document.getElementById('f-type').value,
        experience: document.getElementById('f-experience').value,
        salary: document.getElementById('f-salary').value,
        application_deadline: document.getElementById('f-deadline').value,
        status: document.getElementById('f-status').value,
        short_description: document.getElementById('f-short-desc').value,
        description: document.getElementById('f-desc').value,
        requirements: document.getElementById('f-requirements').value,
        responsibilities: document.getElementById('f-responsibilities').value,
        benefits: document.getElementById('f-benefits').value
      };

      const url = id ? `${getBaseUrl()}/api/admin/jobs/${id}` : `${getBaseUrl()}/api/admin/jobs`;
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(jobData)
        });

        if (res.ok) {
          closeModal();
          fetchJobs();
        } else {
          const errData = await res.json();
          alert(errData.error || 'Failed to save job');
        }
      } catch (err) {
        alert('An error occurred while saving.');
      }
    });

    document.getElementById('open-add-modal').addEventListener('click', openAddModal);
    document.getElementById('close-modal-btn').addEventListener('click', closeModal);
    document.getElementById('cancel-btn').addEventListener('click', closeModal);

    // Initial load
    fetchJobs();
  </script>
</body>
</html>
